version: "2.4"

services:
  postgres:
    env_file: .env.prod

  backend:
    volumes: []   # 프로덕션에서 bind-mount 제거 (이미지 코드 사용)
    env_file: .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE=${KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE:-0.58}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_EMBEDDING_MODEL=${KIMI_EMBEDDING_MODEL:-text-embedding-v1}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - DEV_BYPASS_AUTH=false
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  celery-worker:
    env_file: .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE=${KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE:-0.58}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_EMBEDDING_MODEL=${KIMI_EMBEDDING_MODEL:-text-embedding-v1}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}

  celery-beat:
    env_file: .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE=${KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE:-0.58}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_EMBEDDING_MODEL=${KIMI_EMBEDDING_MODEL:-text-embedding-v1}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}

  frontend:
    volumes: []   # 프로덕션에서 bind-mount 제거
    env_file: .env.prod
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_DEV_BYPASS_AUTH=false

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
