version: "2.4"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: labbase
      POSTGRES_PASSWORD: labbase
      POSTGRES_DB: labbase
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labbase -d labbase"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  backend:
    build: ./backend
    ports:
      - "8100:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE=${KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE:-0.58}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_EMBEDDING_MODEL=${KIMI_EMBEDDING_MODEL:-text-embedding-v1}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3100,http://172.24.105.231:3000,http://172.24.105.231:3100
      - DEV_BYPASS_AUTH=${DEV_BYPASS_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads_data:/var/lib/lumen/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery-worker:
    build: ./backend
    command: celery -A app.celery_config.celery_app worker --loglevel=info -Q ai_tasks,maintenance_tasks
    depends_on:
      - redis
      - backend
    volumes:
      - uploads_data:/var/lib/lumen/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE=${KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE:-0.58}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_EMBEDDING_MODEL=${KIMI_EMBEDDING_MODEL:-text-embedding-v1}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}

  celery-beat:
    build: ./backend
    command: celery -A app.celery_config.celery_app beat --loglevel=info
    depends_on:
      - redis
      - backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KNOWLEDGE_EMBEDDING_PROVIDER=${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      - KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE=${KNOWLEDGE_SEMANTIC_LINK_MIN_SCORE:-0.58}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - KIMI_EMBEDDING_MODEL=${KIMI_EMBEDDING_MODEL:-text-embedding-v1}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}

  frontend:
    build: ./frontend
    user: root
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8088
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_DEV_BYPASS_AUTH=${NEXT_PUBLIC_DEV_BYPASS_AUTH}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run build && npm start"

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  uploads_data:
